services:
  mindvault-api:
    build:
      context: ./server
      dockerfile: Dockerfile

    env_file:
      - ./server/.env.docker

    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:8080

    volumes:
      - mindvault-hf-cache:/home/node/.cache/huggingface

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mindvault-client:
    build:
      context: ./client
      dockerfile: Dockerfile

    ports:
      - "8080:80"

    depends_on:
      mindvault-api:
        condition: service_healthy

    restart: unless-stopped

volumes:
  mindvault-hf-cache:
    name: mindvault-hf-cache
